name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - run: npm ci

      - name: Type check and build the UI
        run: npm run build:ui

      - name: UI tests
        run: npm test

      - name: Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Argon2id at its cheapest is for other crates' tests only (crates/core's test-kdf feature).
      - name: No test password settings in the app or hostd
        if: runner.os == 'Linux'
        run: |
          for crate in glaze-vault glaze-vault-hostd; do
            if cargo tree -e features -p $crate --locked | grep -q test-kdf; then
              echo "::error::$crate is built with crates/core's test-kdf feature"
              exit 1
            fi
          done

      # Every crate's tests run even when one fails, and what failed goes into an annotation.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee rust-tests.log || {
            node .github/annotate.cjs rust-tests.log "Rust tests failed"
            exit 1
          }

      # The development app, driven through its screen and driver files (ADR 11). Linux runners
      # have no display, so Xvfb gives the app one.
      - name: End-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run e2e; else npm run e2e; fi

  # Installs hostd as a real service on each system, syncs with it, and removes it
  # (docs/adr/0022-host-mode.md): what `tauri dev` and the tests cannot reach.
  host-service:
    name: Host service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: host-service

      # Bash on Windows finds Git's Perl first, which lacks modules OpenSSL's build needs.
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build hostd and the dev client
        run: cargo build --locked -p glaze-vault-hostd --bins --examples

      - name: Install, sync, uninstall
        shell: bash
        env:
          GLAZE_PASSWORD: smoke test password
        run: bash .github/host-service.sh

, to try on each system. Releases are built by release.yml.
  bundle:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      # 22.04, the oldest supported Ubuntu, so the AppImage runs on older systems too.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file

      - run: npm ci

      # Bash on Windows finds Git's Perl first, which lacks modules OpenSSL's build needs.
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build hostd for the installers
        shell: bash
        run: node .github/sidecar.cjs ${{ matrix.args }}

      # On failure, the end of the output also goes into an annotation (.github/annotate.cjs).
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --ci --config crates/app/tauri.sidecar.conf.json ${{ matrix.args }} 2>&1 | tee build.log || {
            node .github/annotate.cjs build.log "tauri build failed"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Glaze Vault ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
