name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - run: npm ci

      - name: Type check and build the UI
        run: npm run build:ui

      - name: UI tests
        run: npm test

      - name: Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Argon2id at its cheapest is for other crates' tests only (crates/core's test-kdf feature).
      - name: No test password settings in the app or hostd
        if: runner.os == 'Linux'
        run: |
          for crate in glaze-vault glaze-vault-hostd; do
            if cargo tree -e features -p $crate --locked | grep -q test-kdf; then
              echo "::error::$crate is built with crates/core's test-kdf feature"
              exit 1
            fi
          done

      # Every crate's tests run even when one fails, and what failed goes into an annotation.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee rust-tests.log || {
            node .github/annotate.cjs rust-tests.log "Rust tests failed"
            exit 1
          }

      # The development app, driven through its screen and driver files (ADR 11). Linux runners
      # have no display, so Xvfb gives the app one.
      - name: End-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run e2e; else npm run e2e; fi

      # Two apps, one serving the vault through a development hostd and the other joining it
      # (docs/adr/0023-client-mode.md).
      - name: End-to-end tests on the LAN
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run e2e -- --suite lan; else npm run e2e -- --suite lan; fi

  # Installs hostd as a real service on each system, syncs with it, and removes it
  # (docs/adr/0022-host-mode.md): what `tauri dev` and the tests cannot reach.
  host-service:
    name: Host service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: host-service

      # Bash on Windows finds Git's Perl first, which lacks modules OpenSSL's build needs.
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build hostd and the dev client
        run: cargo build --locked -p glaze-vault-hostd --bins --examples

      - name: Install, sync, uninstall
        shell: bash
        env:
          GLAZE_PASSWORD: smoke test password
        run: bash .github/host-service.sh

  # Phones and tablets (docs/adr/0026-mobile-builds.md): the core and sync crates built for each
  # target, then the app as an unsigned Android APK and an iOS app for the simulator. The mobile
  # projects (crates/app/gen/android and gen/apple) are made fresh by `tauri init` each time, then
  # given Glaze Vault's changes by crates/app/mobile/patch.cjs (docs/adr/0027-phones.md).
  mobile:
    name: Mobile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            targets: aarch64-linux-android,x86_64-linux-android
          - name: iOS
            os: macos-latest
            targets: aarch64-apple-ios,aarch64-apple-ios-sim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile

      - name: Java for Gradle
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner has the Android SDK and NDKs; Tauri looks for the NDK in NDK_HOME, and plain
      # cargo needs the NDK's clang named for the target. OpenSSL, built from source for SQLCipher,
      # configures for Android from ANDROID_NDK_ROOT and needs the NDK's llvm-ranlib named, since the
      # NDK has no aarch64-linux-android-ranlib.
      - name: Use the runner's Android NDK
        if: runner.os == 'Linux'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Core and sync for Android
        if: runner.os == 'Linux'
        run: cargo build --locked -p glaze-vault-core -p glaze-vault-sync --target aarch64-linux-android

      - name: Core and sync for iOS
        if: runner.os == 'macOS'
        run: |
          cargo build --locked -p glaze-vault-core -p glaze-vault-sync --target aarch64-apple-ios
          cargo build --locked -p glaze-vault-core -p glaze-vault-sync --target aarch64-apple-ios-sim

      - name: XcodeGen for the iOS project
        if: runner.os == 'macOS'
        run: brew install xcodegen

      - run: npm ci

      - name: Android APK
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          npx tauri android init --ci
          node crates/app/mobile/patch.cjs android
          npx tauri android build --ci --apk --target aarch64 x86_64 2>&1 | tee build.log || {
            node .github/annotate.cjs build.log "tauri android build failed"
            exit 1
          }

      - name: iOS app for the simulator
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          npx tauri ios init --ci
          node crates/app/mobile/patch.cjs ios
          npx tauri ios build --ci --debug --target aarch64-sim 2>&1 | tee build.log || {
            node .github/annotate.cjs build.log "tauri ios build failed"
            exit 1
          }

      # The camera and local network reasons in crates/app/Info.ios.plist reach the built app
      # (docs/adr/0029-phones-as-replicas.md): without them iOS ends the app when it asks.
      - name: iOS app's permission reasons
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plist=$(find crates/app/gen/apple ~/Library/Developer/Xcode/DerivedData -path '*.app/Info.plist' 2>/dev/null | head -1)
          test -n "$plist" || { echo "::error::No built app Info.plist"; exit 1; }
          for key in NSCameraUsageDescription NSLocalNetworkUsageDescription NSBonjourServices; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist" > /dev/null || { echo "::error::$key is missing from $plist"; exit 1; }
          done

      - name: Android manifest's camera is optional
        if: runner.os == 'Linux'
        shell: bash
        run: grep -q 'android.hardware.camera.any" android:required="false"' crates/app/gen/android/app/src/main/AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Glaze Vault Android
          if-no-files-found: error
          retention-days: 14
          path: crates/app/gen/android/app/build/outputs/apk/**/*.apk

  # Unsigned installers for every push, to try on each system. Releases are built by release.yml.
  bundle:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      # 22.04, the oldest supported Ubuntu, so the AppImage runs on older systems too.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file

      - run: npm ci

      # Bash on Windows finds Git's Perl first, which lacks modules OpenSSL's build needs.
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build hostd for the installers
        shell: bash
        run: node .github/sidecar.cjs ${{ matrix.args }}

      # On failure, the end of the output also goes into an annotation (.github/annotate.cjs).
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --ci --config crates/app/tauri.sidecar.conf.json ${{ matrix.args }} 2>&1 | tee build.log || {
            node .github/annotate.cjs build.log "tauri build failed"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Glaze Vault ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
