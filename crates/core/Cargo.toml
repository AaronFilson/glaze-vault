[package]
name = "glaze-vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
bip39 = { version = "3", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13.0"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "chacha", "x25519"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

[features]
# Argon2id at its cheapest, for the tests of crates that build on this one (crates/sync). Never in
# a release: CI checks.
test-kdf = []

[dev-dependencies]
tempfile = "3.27.0"
