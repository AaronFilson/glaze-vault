[package]
name = "glaze-vault"
description = "Encrypted glaze and clay recipe vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "glaze_vault_app"
# The Tauri CLI links the library itself for phones and tablets: a static library for iOS, a
# shared one for Android (docs/adr/0026-mobile-builds.md).
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
glaze-vault-core = { path = "../core" }
glaze-vault-sync = { path = "../sync" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
uuid = { version = "1.28.0", features = ["serde"] }
zeroize = "1.9.1"

# Phones and tablets are updated by their app stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
