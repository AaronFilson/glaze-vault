[package]
name = "glaze-vault"
description = "Encrypted glaze and clay recipe vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "glaze_vault_app"
# Desktop only. Mobile builds (phase 3) will need "staticlib" and "cdylib" back.
crate-type = ["rlib"]

[dependencies]
glaze-vault-core = { path = "../core" }
glaze-vault-sync = { path = "../sync" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
uuid = { version = "1.28.0", features = ["serde"] }
zeroize = "1.9.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
