[package]
name = "glaze-vault-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ciborium = "0.2.2"
ed25519-dalek = "3.0.0"
getrandom = "0.4"
glaze-vault-core = { path = "../core" }
hex = "0.4.3"
hmac = "0.13.0"
log = "0.4"
mdns-sd = { version = "0.21.6", default-features = false }
# Without its default features, which pull in aws-lc-rs: CMake and NASM on Windows.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.1"
# The only release that uses curve25519-dalek 5, as x25519-dalek and ed25519-dalek do.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "time", "sync", "io-util", "macros", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"

[dev-dependencies]
# Argon2id at its cheapest, so the tests make many vaults quickly. Never in a release build.
glaze-vault-core = { path = "../core", features = ["test-kdf"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
