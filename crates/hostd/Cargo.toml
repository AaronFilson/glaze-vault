[package]
name = "glaze-vault-hostd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "hostd"
path = "src/main.rs"

[dependencies]
glaze-vault-core = { path = "../core" }
glaze-vault-sync = { path = "../sync" }
log = { version = "0.4", features = ["std"] }
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "signal", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
