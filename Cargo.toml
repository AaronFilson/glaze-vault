[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Aaron Filson"]
repository = "https://github.com/AaronFilson/glaze-vault"

# Keep debug builds small: line numbers for our own code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Key derivation, encryption and the database are far too slow unoptimized, even in tests and
# `tauri dev`.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.x25519-dalek]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3
